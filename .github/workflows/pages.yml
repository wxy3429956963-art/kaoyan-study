name: Deploy study site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      cloud_ready: ${{ steps.config.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check cloud configuration
        id: config
        run: node -e "const fs=require('fs'),c=require('./src/supabase-config.json');fs.appendFileSync(process.env.GITHUB_OUTPUT,'ready='+Boolean(c.url&&c.publishableKey)+'\n')"
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/configure-pages@v5
        if: steps.config.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: needs.build.outputs.cloud_ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
